name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  fractalmusic-core:
    name: fractalmusic core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires-python = ">=3.11" and lists 3.11-3.14 in its
        # classifiers — this matrix is what makes that claim continuously
        # true instead of a one-off local check. Lint/type/security run once,
        # on the pinned dev version; every version runs the real test suite.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra midi --python ${{ matrix.python-version }}

      - name: Run make check (ruff, mypy, pytest, bandit)
        if: matrix.python-version == '3.14'
        run: make check

      - name: Run tests
        if: matrix.python-version != '3.14'
        run: uv run pytest

  web:
    name: web (eslint, typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests (playwright)
        run: npm run test:e2e

# gatople_api/ is intentionally NOT covered here. Its pyproject.toml declares
# [tool.uv.sources] path dependencies on cemaf and meridian_library at
# ../../../iccha_context_multi_agent/{cemaf,meridian_library} — a directory
# on this developer's machine that is not a git repository (confirmed
# 2026-09-01: no .git, not pushed anywhere). CI cannot check that out, so
# gatople_api cannot currently be installed, linted, type-checked, or tested
# in any environment other than this one machine. Fixing this requires one
# of: publishing cemaf/meridian_library as installable packages (PyPI or a
# private index), vendoring them into a real, pushed git repo CI can
# check out as a second checkout step, or accepting gatople_api as
# local-development-only until one of those happens. Until then,
# `make api-test` / `make verify` remain the only way to verify gatople_api,
# and they only run where this session's pre-commit hooks are installed.
