name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  fractalmusic-core:
    name: fractalmusic core (lint, types, tests, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra midi

      - name: Run make check (ruff, mypy, pytest, bandit)
        run: make check

  web:
    name: web (eslint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

# chat_bff/ is intentionally NOT covered here. Its pyproject.toml declares
# [tool.uv.sources] path dependencies on cemaf and meridian_library at
# ../../../iccha_context_multi_agent/{cemaf,meridian_library} — a directory
# on this developer's machine that is not a git repository (confirmed
# 2026-09-01: no .git, not pushed anywhere). CI cannot check that out, so
# chat_bff cannot currently be installed, linted, type-checked, or tested
# in any environment other than this one machine. Fixing this requires one
# of: publishing cemaf/meridian_library as installable packages (PyPI or a
# private index), vendoring them into a real, pushed git repo CI can
# check out as a second checkout step, or accepting chat_bff as
# local-development-only until one of those happens. Until then,
# `make bff-test` / `make verify` remain the only way to verify chat_bff,
# and they only run where this session's pre-commit hooks are installed.
