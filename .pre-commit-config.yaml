# landing/ is a separately-deployed site with its own checksummed
# MANIFEST_SHA256.txt — out of this repo's own build pipeline, so no hook
# (including generic whitespace fixers) should touch it.
exclude: ^landing/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # web/tsconfig*.json are JSONC (allow comments) — valid TypeScript,
        # not valid strict JSON.
        exclude: tsconfig.*\.json$
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: mixed-line-ending
      - id: name-tests-test
        # gatople_api/tests/eval/run_calibration.py is a manually-invoked
        # script (`uv run python tests/eval/run_calibration.py`), not a
        # pytest test.
        exclude: ^gatople_api/tests/eval/
        args: ["--pytest-test-first"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^(fractalmusic|scripts)/
      - id: ruff-format
        files: ^(fractalmusic|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Scoped to match [tool.mypy] files = ["fractalmusic", "scripts"] in
        # pyproject.toml — pre-commit passes changed filenames directly to the
        # hook, which bypasses that `files` setting and would otherwise check
        # tests/ too (never annotated to satisfy disallow_untyped_defs).
        files: ^(fractalmusic|scripts)/
        args: ["--config-file=pyproject.toml"]

  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "fractalmusic"]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        files: pyproject\.toml$
        additional_dependencies: ["validate-pyproject-schema-store[all]", "packaging>=24.2"]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check (fractalmusic core)
        # `language: system` + a bare `pytest` entry only works if something's
        # on PATH — this project never installs one there (uv + .venv only,
        # per python-environment.md), so the bare form silently no-ops or
        # errors "Executable not found" depending on the caller's shell.
        entry: bash -c 'uv run pytest'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gatople-api-ruff
        name: gatople_api ruff
        entry: bash -c 'cd gatople_api && uv run ruff check src tests'
        language: system
        files: ^gatople_api/.*\.py$
        pass_filenames: false

      - id: gatople-api-mypy
        name: gatople_api mypy
        entry: bash -c 'cd gatople_api && uv run mypy src'
        language: system
        files: ^gatople_api/src/.*\.py$
        pass_filenames: false

      - id: gatople-api-pytest
        name: gatople_api pytest
        entry: bash -c 'cd gatople_api && uv run pytest'
        language: system
        files: ^gatople_api/
        pass_filenames: false
        stages: [pre-push]

      - id: web-eslint
        name: web eslint
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: web-test
        name: web unit tests (vitest)
        entry: bash -c 'cd web && npm run test'
        language: system
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: web-build
        name: web build (tsc + vite)
        entry: bash -c 'cd web && npm run build'
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]

      - id: web-e2e
        name: web e2e (playwright)
        entry: bash -c 'cd web && npm run test:e2e'
        language: system
        files: ^web/(src|e2e|public)/
        pass_filenames: false
        stages: [pre-push]

      - id: no-commit-to-main
        name: no-commit-to-main
        entry: bash -c 'if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then echo "Direct commits to main are not allowed"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
